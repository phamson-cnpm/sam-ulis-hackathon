
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Bản quét PDF, ảnh (MAX_UPLOAD_SIZE_MB=20 trong be_sam/.env) và file Excel nhập dữ liệu (be_sam nhận đến 20 MB)
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------- API ----------
    # src/config/api.js: REACT_APP_API_BASE_URL để trống thì gọi /api/v1 (đường dẫn TƯƠNG ĐỐI).
    # Gọi backend bằng TÊN CONTAINER sam-backend trong mạng sam_network (be_sam/start.sh tạo).
    # KHÔNG có dấu / cuối proxy_pass -> giữ nguyên /api/v1/... khi chuyển tiếp.
    # Thêm nhầm dấu / vào là mọi API trả 404.
    location /api/ {
        proxy_pass http://sam-backend:8000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nhập file Excel vài nghìn tài sản
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------- File build (tên file có mã băm, giữ lâu) ----------
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Service worker nhận thông báo đẩy và manifest (Thêm vào Màn hình chính): luôn lấy bản mới
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
